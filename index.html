<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!--
      화면 배율. **문서를 읽는 도중에 걸어야 한다** — 앱 스크립트가 뜬 뒤에 걸면
      화면이 한 번 작게 그려졌다가 뛴다. 실기기에서 크기를 고르기 위한 임시
      장치이며, 값이 정해지면 여기와 uiScale.js·측정 화면을 함께 걷어내고
      정해진 배율을 화면 코드의 치수에 반영한다. (설계문서 6.2절 47번)

      뷰포트 메타(initial-scale)로 걸어 봤으나 기기에서 반영되지 않았다.
    -->
    <script>
      try {
        var s = Number(localStorage.getItem('tablet-app:ui-scale'))
        if (s > 1) {
          document.documentElement.style.zoom = s
          /* 화면 높이(h-app)가 읽는다. zoom은 뷰포트 단위까지 줄여주지 않는다 */
          document.documentElement.style.setProperty('--ui-scale', s)
        }
      } catch (e) { /* 저장소를 못 읽으면 기본 배율이다 */ }
    </script>
    <!-- 주소창 없는 standalone으로 띄운다. 실기기 논리 해상도 실측의 전제다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F5F6F8" />
    <title>태블릿 상담사용 앱</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
